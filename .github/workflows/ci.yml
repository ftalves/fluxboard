name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm test --workspace @fluxboard/domain
      - run: npm test --workspace @fluxboard/backend
      - run: npm test --workspace @fluxboard/frontend
      - run: npm run build --workspace @fluxboard/frontend
